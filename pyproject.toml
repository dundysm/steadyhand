[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "steadyhand"
version = "0.28.0"
description = "Turn a written lab protocol into a robot program and rehearse it before it touches a real bench."
dynamic = ["readme"]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dundy Pasupuleti" }]
keywords = ["lab automation", "liquid handling", "simulation", "mujoco", "pylabrobot", "opentrons"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  # The 0.2 line is the current stable PyLabRobot API. 1.0 is in beta and moves
  # the liquid-handling classes; support for it is tracked in the README.
  "pylabrobot>=0.2.2,<0.3",
  "mujoco>=3.2",
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/dundysm/steadyhand"
Issues = "https://github.com/dundysm/steadyhand/issues"
"What it stops" = "https://github.com/dundysm/steadyhand/blob/main/docs/faults.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4", "opentrons>=9.1"]
pdf = ["pypdf>=4"]
# Opentrons' own software: its labware definitions and its simulator, for the Flex and OT-2.
opentrons = ["opentrons>=9.1"]

[project.scripts]
steadyhand = "steadyhand.cli:main"

# The README is the page on PyPI too. Its links and pictures point into this repository, so
# they are made absolute when the package is built.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+\.(?:png|gif|jpg|svg))\)'
replacement = '](https://raw.githubusercontent.com/dundysm/steadyhand/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/dundysm/steadyhand/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/steadyhand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
